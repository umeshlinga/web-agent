<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Customer — Pulse CRM</title>
<style>
:root{--ink:#182420;--muted:#5d6f66;--bg:#edf2ee;--card:#fff;--line:#dce5dd;--line2:#e9efe9;--green:#0b7a37;--green2:#17a34a;--green-soft:#e8f5ec;--red:#b3261e;--red-soft:#fdecea;--amber:#9a6a06;--amber-soft:#fdf3e0;--blue:#175cd3;--blue-soft:#eaf1fe;--radius:14px;--shadow:0 1px 2px rgba(18,42,28,.05),0 12px 32px rgba(18,42,28,.08)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.topbar{background:linear-gradient(100deg,#06351c,#0b7a37 55%,#17a34a);color:#fff}
.topbar-in{max-width:1060px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.topnav{margin-left:auto;display:flex;gap:4px}
.topnav span,.topnav a{color:rgba(255,255,255,.85);font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:8px;text-decoration:none}
.topnav a:hover{background:rgba(255,255,255,.15);color:#fff}
.topnav .here{background:rgba(255,255,255,.17);color:#fff}
.page{max-width:1060px;margin:0 auto;padding:26px 20px 60px}
.page-head{margin:4px 0 20px}
.page-head h1{font-size:27px;line-height:1.2;margin:0 0 4px;font-weight:750;letter-spacing:-.02em}
.page-head p{margin:0;color:var(--muted);font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin:0 0 20px}
.card h2{font-size:17px;margin:0 0 6px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);padding:22px 26px 26px;margin:0 0 20px}
legend{font-size:16px;font-weight:700;padding:0 8px}
label{display:block;font-size:13px;font-weight:650;color:#33463b;margin:15px 0 6px}
input[type=text],input[type=password],input[type=email],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid #c9d6cb;border-radius:9px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(23,163,74,.18)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--green);vertical-align:-2px;margin-right:7px}
button,.btn{display:inline-block;font:inherit;font-size:14.5px;font-weight:650;padding:10px 18px;border-radius:9px;border:1px solid #c9d6cb;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgba(18,42,28,.05)}
button:hover,.btn:hover{border-color:#a9c2ae;background:#f6faf6}
.btn-primary{background:linear-gradient(120deg,var(--green),var(--green2))!important;border-color:transparent!important;color:#fff!important;box-shadow:0 4px 14px rgba(11,122,55,.28)}
.btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 14px;background:#f4f8f4;border-bottom:1px solid var(--line)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f6faf6}
.notice{border-radius:11px;padding:13px 16px;font-size:14.5px;font-weight:600;margin:0 0 20px}
.notice-ok{background:var(--green-soft);color:#075e2a;border:1px solid #bfe6cd}
.notice-err{background:var(--red-soft);color:var(--red);border:1px solid #f5c6c2}
.notice ul,.errors{margin:0;padding-left:18px}
.errors{color:var(--red);font-size:14px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2.5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eef2ee;color:#43564b}
tr[data-status="Active"] .pill,.pill.ok{background:var(--green-soft);color:#075e2a}
tr[data-status="Prospect"] .pill,.pill.info{background:var(--blue-soft);color:var(--blue)}
tr[data-status="On hold"] .pill,.pill.warn{background:var(--amber-soft);color:var(--amber)}
#cust-status[data-status="Active"]{background:var(--green-soft);color:#075e2a}
#cust-status[data-status="Prospect"]{background:var(--blue-soft);color:var(--blue)}
#cust-status[data-status="On hold"]{background:var(--amber-soft);color:var(--amber)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 20px}
.stat{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.15}
.stat span{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:9px 18px;font-size:14.5px;margin:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.done span{text-decoration:line-through;color:var(--muted)}
.subnav{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}
</style></head>
<body>
  <div class="topbar"><div class="topbar-in">
    <div class="brand"><span class="mark">P</span>Pulse CRM</div>
    <div class="topnav">
      <a href="portal_home.html">Dashboard</a>
      <a class="here" href="portal_customers.html">Customers</a>
      <a href="portal_settings.html">Settings</a>
    </div>
  </div></div>
  <div class="page">
    <div class="page-head">
      <h1 id="cust-name"></h1>
      <p>Customer record — contact details, status and notes.</p>
    </div>
    <div id="portal-saved" class="notice notice-ok" hidden></div>
    <div class="card">
      <dl class="kv">
        <dt>Contact</dt><dd id="cust-contact"></dd>
        <dt>Status</dt><dd><span id="cust-status" class="pill"></span></dd>
        <dt>Phone</dt><dd id="cust-phone"></dd>
        <dt>Notes</dt><dd id="cust-note"></dd>
      </dl>
    </div>
    <div class="subnav">
      <a class="btn btn-primary" id="link-edit" href="portal_customer_edit.html">Edit customer</a>
      <a class="btn" id="link-activity" href="portal_activity.html">Activity</a>
      <a class="btn" id="link-back" href="portal_customers.html">Back to customers</a>
    </div>
  </div>
  <script>
    var CUSTOMERS = {
      pulseworks: { name: 'Pulseworks', contact: 'Dana Ruiz', status: 'Prospect', phone: '555-0108', note: 'Prefers email over phone.' },
      bluefin: { name: 'Bluefin Studio', contact: 'Alex Park', status: 'Active', phone: '555-0119', note: 'Pays invoices on the 1st.' },
      harborline: { name: 'Harborline', contact: 'Elena Brooks', status: 'On hold', phone: '555-0126', note: 'Renewal on hold until January.' },
      northbeam: { name: 'Northbeam Traders', contact: 'Marta Chen', status: 'Prospect', phone: '555-0131', note: 'Asked for a security review.' }
    };
    var params = new URLSearchParams(location.hash.slice(1));
    var id = params.get('c') || 'pulseworks';
    var rec = CUSTOMERS[id] || CUSTOMERS.pulseworks;
    var status = params.get('status') || rec.status;
    var phone = params.get('phone') || rec.phone;
    var note = params.get('note') || rec.note;
    document.getElementById('cust-name').textContent = rec.name;
    document.getElementById('cust-contact').textContent = rec.contact;
    var st = document.getElementById('cust-status');
    st.textContent = status;
    st.setAttribute('data-status', status);
    document.getElementById('cust-phone').textContent = phone;
    document.getElementById('cust-note').textContent = note;
    if (params.get('saved') === '1') {
      var d = document.getElementById('portal-saved');
      d.textContent = 'Record saved for ' + rec.name;
      d.hidden = false;
    }
    document.getElementById('link-edit').href = 'portal_customer_edit.html#c=' + id;
    document.getElementById('link-activity').href = 'portal_activity.html#c=' + id;
    var back = 'portal_customers.html';
    if (params.get('status') || params.get('phone')) {
      back += '#c=' + id + '&status=' + encodeURIComponent(status) +
              '&phone=' + encodeURIComponent(phone);
    }
    document.getElementById('link-back').href = back;
  </script>
</body>
</html>
