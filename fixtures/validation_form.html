<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Register</title></head>
<body>
  <h1>Register</h1>
  <!-- Long form with server-style validation: submitting with a bad
       email and mismatched passwords reports both errors; the agent
       must correct each field and resubmit. -->
  <form id="reg-form">
    <label for="reg-name">Full name</label>
    <input id="reg-name" name="reg-name" type="text">
    <label for="reg-email">Email</label>
    <input id="reg-email" name="reg-email" type="text">
    <label for="reg-age">Age</label>
    <input id="reg-age" name="reg-age" type="text">
    <label for="reg-pass">Password</label>
    <input id="reg-pass" name="reg-pass" type="password">
    <label for="reg-confirm">Confirm password</label>
    <input id="reg-confirm" name="reg-confirm" type="password">
    <button id="reg-btn" type="submit">Register</button>
  </form>
  <ul id="reg-errors"></ul>
  <div id="reg-done" hidden></div>
  <script>
    document.getElementById('reg-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('reg-email').value;
      var age = document.getElementById('reg-age').value;
      var p1 = document.getElementById('reg-pass').value;
      var p2 = document.getElementById('reg-confirm').value;
      var errs = [];
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        errs.push('Enter a valid email address');
      }
      if (!/^\d+$/.test(age) || Number(age) < 18 || Number(age) > 99) {
        errs.push('Age must be between 18 and 99');
      }
      if (p1.length < 6) {
        errs.push('Password must be at least 6 characters');
      } else if (p1 !== p2) {
        errs.push('Passwords do not match');
      }
      var ul = document.getElementById('reg-errors');
      ul.innerHTML = '';
      errs.forEach(function (m) {
        var li = document.createElement('li');
        li.textContent = m;
        ul.appendChild(li);
      });
      if (!errs.length) {
        var n = document.getElementById('reg-name').value;
        var d = document.getElementById('reg-done');
        d.textContent = 'Registration complete for ' + n;
        d.hidden = false;
      }
    });
  </script>
</body>
</html>
