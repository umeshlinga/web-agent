<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Employees</title></head>
<body>
  <h1>Employees</h1>
  <!-- 12 rows, page size 4: department filter + score sort + paging
       interact — the visible window depends on all three. -->
  <label for="dept">Department</label>
  <select id="dept" name="dept">
    <option value="All">All</option>
    <option value="Eng">Eng</option>
    <option value="Ops">Ops</option>
    <option value="Sales">Sales</option>
  </select>
  <table id="emp-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Department</th>
        <th><button id="sort-score" type="button">Score</button></th>
      </tr>
    </thead>
    <tbody id="emp"></tbody>
  </table>
  <button id="pg-prev" type="button">Prev</button>
  <span id="page-info"></span>
  <button id="pg-next" type="button">Next</button>
  <script>
    var DATA = [
      ['Priya', 'Eng', 88], ['Marco', 'Eng', 74], ['June', 'Eng', 95],
      ['Tomas', 'Eng', 61], ['Rita', 'Ops', 82], ['Omar', 'Ops', 67],
      ['Lena', 'Ops', 90], ['Karl', 'Ops', 55], ['Nina', 'Sales', 79],
      ['Paul', 'Sales', 84], ['Sara', 'Sales', 70], ['Ivan', 'Sales', 93]
    ];
    var PAGE_SIZE = 4;
    var state = { dept: 'All', sortDesc: false, page: 1 };

    function viewRows() {
      var rows = DATA.filter(function (r) {
        return state.dept === 'All' || r[1] === state.dept;
      });
      if (state.sortDesc) {
        rows = rows.slice().sort(function (a, b) { return b[2] - a[2]; });
      }
      return rows;
    }

    function render() {
      var rows = viewRows();
      var pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      if (state.page > pages) state.page = pages;
      var tbody = document.getElementById('emp');
      tbody.innerHTML = '';
      rows.forEach(function (r, i) {
        var tr = document.createElement('tr');
        r.forEach(function (v) {
          var td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        var p = Math.floor(i / PAGE_SIZE) + 1;
        if (p !== state.page) tr.style.display = 'none';
        tbody.appendChild(tr);
      });
      document.getElementById('page-info').textContent =
        'Page ' + state.page + ' of ' + pages;
    }

    document.getElementById('dept').addEventListener('change', function () {
      state.dept = this.value;
      state.page = 1;
      render();
    });
    document.getElementById('sort-score').addEventListener('click', function () {
      state.sortDesc = true;
      state.page = 1;
      render();
    });
    document.getElementById('pg-next').addEventListener('click', function () {
      var pages = Math.ceil(viewRows().length / PAGE_SIZE);
      if (state.page < pages) state.page += 1;
      render();
    });
    document.getElementById('pg-prev').addEventListener('click', function () {
      if (state.page > 1) state.page -= 1;
      render();
    });
    render();
  </script>
</body>
</html>
